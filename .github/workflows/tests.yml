name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 20 is het minimum (engines); 22 draait op de vloot.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Types gelijk aan de bron
        run: npm run check:types

      - name: Versies gelijk (package.json en plugin.json)
        run: |
          node -e '
            const a = require("./package.json").version
            const b = require("./plugin/.claude-plugin/plugin.json").version
            if (a !== b) { console.error(`package.json ${a} ≠ plugin.json ${b}`); process.exit(1) }
          '

  # Een app installeert dit pakket als git-afhankelijkheid zonder buildstap.
  # Deze job doet precies dat met de bron van deze commit en laadt het, zodat een
  # vergeten bestand in `files` of een kapotte exports-map hier rood wordt en niet
  # pas in een app.
  installeren-als-app:
    name: Installeren zoals een app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: bouwsteen

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pakket maken en installeren in een lege app
        run: |
          cd bouwsteen && npm pack --pack-destination .. && cd ..
          mkdir app && cd app && npm init -y >/dev/null && npm pkg set type=module
          npm install ../motrac-docusign-*.tgz --no-audit --no-fund
          node --input-type=module -e '
            const ds = await import("@motrac/docusign")
            const t = await import("@motrac/docusign/testing")
            if (typeof ds.maakDocusign !== "function" || typeof t.startNepDocusign !== "function") process.exit(1)
            console.log("exports ok")
          '
          test -f node_modules/@motrac/docusign/INTEGREREN.md
          test -f node_modules/@motrac/docusign/types/index.d.ts
          test -f node_modules/@motrac/docusign/sql/docusign_webhook_event.sql

      - name: Vendor-stap
        run: |
          cd app && mkdir dist && echo '{"name":"app","type":"module"}' > dist/package.json
          npx motrac-docusign-vendor dist
          grep -q '"@motrac/docusign": "file:./vendor/motrac-docusign"' dist/package.json
